<!DOCTYPE html>
<html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HALKA — Düzeltilmiş Çember</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"><style>:root{--bg:#11110f;--panel:#1b1b18;--text:#f4f0e8;--muted:#aaa598;--line:#3a372f;--gold:#d9b978}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 50% 0,#33291c 0,transparent 34%),var(--bg);color:var(--text);font-family:Inter,sans-serif}.wrap{width:min(700px,calc(100% - 30px));padding:45px 0}.eyebrow{font:600 12px Fredoka;color:var(--gold);letter-spacing:1.8px;text-transform:uppercase}.card{margin-top:14px;background:linear-gradient(145deg,#211f1b,#171714);border:1px solid #796a4b;border-radius:26px;padding:24px}.stage{height:460px;display:grid;place-items:center;background:radial-gradient(circle,#d9b97812,transparent 62%);border-radius:19px;position:relative}.stage:after{content:"";position:absolute;bottom:40px;width:170px;height:22px;background:#0009;filter:blur(14px);border-radius:50%}.mascot{width:390px;height:390px;max-width:96%;z-index:1;filter:drop-shadow(0 18px 18px #0009);animation:float 3.5s ease-in-out infinite}.orbit{transform-origin:110px 91px;animation:orbit 10s linear infinite}.blink{transform-origin:center;animation:blink 4.5s infinite}h1{font:600 clamp(34px,7vw,50px) Fredoka;margin:18px 0 9px}.desc{color:var(--muted);line-height:1.65}.note{margin-top:16px;padding:12px 14px;border-left:3px solid var(--gold);background:#29261e;border-radius:5px 12px 12px 5px;color:#f0d8a2}@keyframes float{50%{transform:translateY(-8px)}}@keyframes orbit{to{transform:rotate(360deg)}}@keyframes blink{0%,46%,50%,100%{transform:scaleY(1)}48%{transform:scaleY(.08)}}@media(max-width:600px){.stage{height:370px}.mascot{width:330px;height:330px}.card{padding:14px}}</style></head><body><main class="wrap"><div class="eyebrow">HALKA · Tek düzeltme</div><article class="card"><div class="stage"><svg class="mascot" viewBox="0 0 220 220" aria-label="Başının arkasında dönen dört halkalı Çember maskotu"><g class="orbit" fill="none" stroke-width="7"><circle cx="89" cy="67" r="27" stroke="#7f77dd"/><circle cx="131" cy="67" r="27" stroke="#1d9e75"/><circle cx="89" cy="109" r="27" stroke="#ef9f27"/><circle cx="131" cy="109" r="27" stroke="#d85a30"/></g><path d="M72 104h76v70H72z" fill="#32302b"/><path d="M68 111 38 177l55-16M152 111l30 66-55-16" fill="#24231f" stroke="#7f77dd" stroke-width="5"/><circle cx="110" cy="94" r="43" fill="#e9ddc5"/><g class="blink" fill="#25231f"><ellipse cx="95" cy="89" rx="4" ry="6"/><ellipse cx="125" cy="89" rx="4" ry="6"/></g><path d="M98 108q12 8 24 0" fill="none" stroke="#25231f" stroke-width="4" stroke-linecap="round"/><rect x="55" y="145" width="31" height="12" rx="3" fill="#e9ddc5" stroke="#25231f" stroke-width="4"/><rect x="134" y="145" width="31" height="12" rx="3" fill="#e9ddc5" stroke="#25231f" stroke-width="4"/><path d="M84 156h52v35H84z" fill="#f0d8a2" stroke="#25231f" stroke-width="4"/><path d="M110 156v35" stroke="#25231f" stroke-width="3"/></svg></div><h1>Çember</h1><p class="desc">Orijinal baş, yüz, pelerin, kitap gövdesi ve karakter oranları değiştirilmedi. Yalnızca yüzdeki dört halka yüzün arkasına taşındı ve yavaşça dönecek şekilde ayarlandı.</p><div class="note">Anime kız alternatifi kaldırıldı. Bundan sonraki geliştirme bu özgün karakter üzerinden ilerleyecek.</div></article></main></body></html>
